<ion-card *ngIf="produto">
  <ion-card-header>
    <span><b>{{ produto.nome }}</b></span>
  </ion-card-header>

  <ion-card-content>
    <ion-button (click)="menos(produto)">-</ion-button>
    <p>{{produto.quantidade}}x Preço: {{ produto.preco }}</p>
    <ion-button (click)="mais(produto)">+</ion-button>
    <ion-button (click)="removerproduto(produto)">Remover Produto</ion-button>
  </ion-card-content>
</ion-card>
