<ion-card *ngIf="produto">
  <ion-card-header>
    <span><b>{{ produto.nome }}</b></span>
  </ion-card-header>

  <ion-card-content>
    <p>Preço: {{ produto.preco }}</p>
    
    <p *ngIf="produto.doce">Doce</p>
    <p *ngIf="produto.esgotado">Esgotado</p>
    <p *ngIf="produto.ultimasunidades">Últimas unidades</p>
  </ion-card-content>

  <ion-button (click)="colocarComanda(produto)">
    Colocar na Comanda
  </ion-button>
</ion-card>
