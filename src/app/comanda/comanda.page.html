<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Bar do Joaquim</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="cardapio()">Cardápio</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">comanda</ion-title>
    </ion-toolbar>
  </ion-header>

  <div *ngFor="let produto of carrinho">
    <app-comanda-card
    [produto]="produto"></app-comanda-card>
  </div>

</ion-content>
