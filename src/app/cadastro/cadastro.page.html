<ion-content class="ion-padding">

  <div class="login-wrap">

    <div class="login-marca">
      <h1>Criar conta</h1>
    </div>

    <ion-card>
      <ion-card-content>

        <ion-item lines="none">
          <ion-label position="stacked">E-mail</ion-label>
          <ion-input
            type="email"
            [(ngModel)]="email"
            placeholder="ex: joaquim@ifsc.edu.br">
          </ion-input>
        </ion-item>

        <ion-item lines="none">
          <ion-label position="stacked">Senha</ion-label>
          <ion-input
            type="password"
            [(ngModel)]="senha"
            placeholder="Mínimo de 6 caracteres">
          </ion-input>
        </ion-item>

        <p class="msg-erro" *ngIf="mensagemErro">
          {{ mensagemErro }}
        </p>

        <ion-button expand="block" (click)="cadastrar()">
          Cadastrar
        </ion-button>

        <ion-button expand="block" fill="clear" routerLink="/login">
          Já tenho conta
        </ion-button>

      </ion-card-content>
    </ion-card>

  </div>

</ion-content>
